aid: back-office
name: Back Office
description: >-
  Back Office, Inc. operates Finally (finally.com), a Miami-based fintech that provides a unified,
  AI-powered bookkeeping, accounting, and finance suite for growing small and medium-sized businesses.
  The platform combines automated bookkeeping and ledger management, accounts payable and bill pay,
  expense management, corporate cards with built-in controls, invoicing, payment processing, payroll
  across 150+ countries, and credit monitoring, with AI agents that classify transactions, reconcile
  accounts, close the books, and prepare audits. Founded in 2018 and trusted by over 3,500 companies,
  Finally publishes a SOC 2 trust center but does not currently expose a public developer API or
  developer portal; this profile tracks its identity, web properties, and security posture in the API
  Evangelist network.
